id: supertux
name: SuperTux

runtime:
  type: docker
  service: game-supertux
  port: 80

hosting:
  hostname: supertux.localhost
  capabilities:
    - autoplay
    - fullscreen
    - gamepad
    - persistent-storage

metadata:
  genre: 2D Platformer
  developer: "SuperTux Development Team"
  license: GPL-3.0-or-later
  upstream: https://github.com/SuperTux/supertux/
  multiplayer: false
  icon: "🐧"
  description: A free and open-source 2D side-scrolling platform game heavily inspired by Nintendo's Super Mario Bros. series
